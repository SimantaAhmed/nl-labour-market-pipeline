name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Not editable, so tests run against the package as the pipeline installs it.
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest -q
